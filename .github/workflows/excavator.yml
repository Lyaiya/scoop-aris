name: Excavator

on:
  workflow_dispatch:
  schedule:
    # Every 6 hours at 02:27, 08:27, 14:27 and 20:27 Asia/Shanghai
    - cron: "27 */6 * * *"

permissions:
  contents: write

jobs:
  excavate:
    name: Excavate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Excavate
        uses: ScoopInstaller/GithubActions@5bceeda181721d9d10a18fdcc3ddca6f33467ae6 # v3.0.0
        env:
          SKIP_UPDATED: 1
